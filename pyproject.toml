[project]
name = "audio-story-studio"
version = "0.1.0"
description = "Automated Vietnamese AI audio-story video production (Dark Fantasy Cinematic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "piper-tts>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
# Offline VieNeu TTS. Installed in the separate venv storage/tools/vieneu/venv,
# which runs studio/tts/vieneu_worker.py (TTS_PROVIDER=vieneu).
vieneu = ["vieneu>=3.8", "soundfile>=0.13"]
# Pronunciation audits in scripts/oneoff (ASR + resampling).
audit = ["faster-whisper>=1.2", "soundfile>=0.13", "soxr>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a local PostgreSQL test database",
    "media: needs ffmpeg/ffprobe",
    "slow: end-to-end style tests",
]

[tool.ruff]
line-length = 140
extend-exclude = ["scripts/oneoff", "storage", "build"]

[tool.ruff.lint]
# Bug-finding rules only for now (pyflakes, syntax errors, bugbear); style rules can be added later.
select = ["F", "E9", "B"]
ignore = [
    "B904",  # raise HTTPException inside except without `from` — intentional in API handlers
    "B905",  # zip() without strict= — adding strict would change runtime behaviour
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]
