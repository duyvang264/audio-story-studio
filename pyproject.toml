[project]
name = "audio-story-studio"
version = "0.1.0"
description = "Automated Vietnamese AI audio-story video production (Dark Fantasy Cinematic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "piper-tts>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a local PostgreSQL test database",
    "media: needs ffmpeg/ffprobe",
    "slow: end-to-end style tests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio", "studio.tts", "studio.visual", "studio.audio_engine"]
